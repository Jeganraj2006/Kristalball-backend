services:
  - type: web
    name: kavach-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @kavach/api prisma:generate && pnpm --filter @kavach/api build
    startCommand: pnpm --filter @kavach/api prisma:deploy && pnpm --filter @kavach/api start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://kavach-demo-20261123.smoky-tune-9122.chatgpt.site
      - key: DATABASE_URL
        fromDatabase:
          name: kavach-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

databases:
  - name: kavach-postgres
    region: singapore
    plan: free
    databaseName: kavach_postgres
    user: kavach_postgres_user
